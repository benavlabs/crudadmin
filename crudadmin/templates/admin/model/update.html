{% extends "base/base.html" %}

{% block title %}Update {{ model_name }}{% endblock %}

{% set include_sidebar_and_header = False %}

{% block content %}
<div class="admin-content">
    <style>
        .error-message {
            background-color: #FEE2E2;
            border: 1px solid #F87171;
            color: #991B1B;
            padding: 1rem;
            margin-bottom: 1.5rem;
            border-radius: 0.375rem;
        }

        .dark-theme .error-message {
            background-color: rgba(248, 113, 113, 0.1);
            border-color: rgba(248, 113, 113, 0.2);
            color: #FCA5A5;
        }

        .field-error {
            color: #DC2626;
            font-size: 0.875rem;
            margin-top: 0.5rem;
        }

        .dark-theme .field-error {
            color: #F87171;
        }

        .admin-content {
            padding: 2rem;
            max-width: 1400px;
            margin: 0 auto;
        }

        .update-form-container {
            max-width: 800px;
            margin: 0 auto;
        }

        .page-header {
            margin-bottom: 2rem;
        }

        .page-title {
            color: var(--text-primary-light);
            font-size: 1.5rem;
            font-weight: 600;
        }

        .dark-theme .page-title {
            color: var(--text-primary-dark);
        }

        .field-section {
            background: var(--bg-primary-light);
            border: 1px solid var(--border-light);
            border-radius: var(--border-radius-lg);
            padding: 1.5rem;
        }

        .dark-theme .field-section {
            background: var(--bg-primary-dark);
            border-color: var(--border-dark);
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-group:last-child {
            margin-bottom: 0;
        }

        .form-label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.25rem; /* Slight margin below the label */
        }

        .label-text {
            font-weight: 500;
            color: var(--text-primary-light);
        }

        .dark-theme .label-text {
            color: var(--text-primary-dark);
        }

        .required {
            background: var(--danger-color);
            color: white;
            padding: 0.25rem 0.5rem;
            border-radius: 999px;
            font-size: 0.75rem;
        }

        .form-control {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border-light);
            border-radius: var(--border-radius-md);
            background: var(--bg-secondary-light);
            color: var(--text-primary-light);
            transition: all 0.2s;
        }

        .dark-theme .form-control {
            background: var(--bg-secondary-dark);
            border-color: var(--border-dark);
            color: var(--text-primary-dark);
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(0, 150, 136, 0.1);
        }

        .help-text {
            margin-bottom: 0.5rem; /* Space above the input */
            font-size: 0.75rem;
            color: var(--text-secondary-light);
        }

        .dark-theme .help-text {
            color: var(--text-secondary-dark);
        }

        .input-help {
            font-size: 0.75rem;
            color: var(--text-secondary-light);
            margin-top: 0.25rem;
        }

        .dark-theme .input-help {
            color: var(--text-secondary-dark);
        }

        .form-actions {
            background: var(--bg-primary-light);
            border: 1px solid var(--border-light);
            border-radius: var(--border-radius-lg);
            padding: 1.5rem;
            display: flex;
            justify-content: flex-end;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .dark-theme .form-actions {
            background: var(--bg-primary-dark);
            border-color: var(--border-dark);
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border-radius: var(--border-radius-md);
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-secondary {
            background: var(--bg-secondary-light);
            border: 1px solid var(--border-light);
            color: var(--text-primary-light);
            text-decoration: none;
        }

        .dark-theme .btn-secondary {
            background: var(--bg-secondary-dark);
            border-color: var(--border-dark);
            color: var(--text-primary-dark);
        }

        .btn-primary {
            background: var(--primary-color);
            color: white;
            border: none;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
        }

        @media (max-width: 768px) {
            .admin-content {
                padding: 1rem;
            }

            .form-actions {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }

        /* Additional styling for special field types (like <select>, checkboxes, etc.) */
        .form-control[type="datetime-local"],
        .form-control[type="date"],
        .form-control[type="time"] {
            padding: 0.6rem 0.75rem;
        }

        /* Hide the default select arrow and show a custom one */
        select.form-control {
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            background: var(--bg-secondary-light)
                        url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3e%3cpath fill='none' stroke='%23343a40' stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M2 5l6 6 6-6'/%3e%3c/svg%3e")
                        no-repeat right 0.75rem center / 16px 12px;
            padding-right: 2.5rem;
        }

        .dark-theme select.form-control {
            background: var(--bg-secondary-dark)
                        url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3e%3cpath fill='none' stroke='%23ffffff' stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M2 5l6 6 6-6'/%3e%3c/svg%3e")
                        no-repeat right 0.75rem center / 16px 12px;
        }

        select.form-control::-ms-expand {
            display: none; /* IE/Edge */
        }

        .form-control[type="checkbox"] {
            width: auto;
            margin-top: 0.5rem;
        }

        .checkbox-wrapper {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .radio-group {
            display: flex;
            gap: 1.5rem;
            margin-top: 0.5rem;
        }

        .radio-option {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
            font-weight: normal;
        }

        .radio-option input[type="radio"] {
            cursor: pointer;
            width: auto;
        }

        .form-control[type="number"] {
            -moz-appearance: none;
        }

        .form-control[type="number"]::-webkit-outer-spin-button,
        .form-control[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        textarea.form-control {
            min-height: 100px;
            resize: vertical;
        }
    </style>

    <div class="update-form-container">
        <div class="page-header">
            <h1 class="page-title">Update {{ model_name }}</h1>
        </div>

        {% if error %}
        <div class="error-message">
            {{ error }}
        </div>
        {% endif %}

        <form method="post" action="{{ url_prefix }}/{{ model_name }}/form_update/{{ id }}" enctype="multipart/form-data">
            <div class="field-section">
                {% include "admin/model/components/form_fields.html" %}
            </div>

            <!-- Form Actions -->
            <div class="form-actions">
                <a href="{{ url_prefix }}/{{ model_name }}/" class="btn btn-secondary">Cancel</a>
                <button type="submit" class="btn btn-primary">Update {{ model_name }}</button>
            </div>
        </form>
    </div>
</div>

{% endblock %}
